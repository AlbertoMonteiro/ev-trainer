<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EVs Trainer</title>
    <base href="/" />
    <script>
        (function () {
            try {
                var prefs = JSON.parse(localStorage.getItem('evtrainer:v1:prefs') || '{}');
                if (prefs.theme === 'light' || prefs.theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', prefs.theme);
                }
                if (prefs.language) {
                    document.documentElement.setAttribute('lang', prefs.language);
                }
            } catch (e) { }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#c8202f" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot" role="status">EVs Trainer</div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/interop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
