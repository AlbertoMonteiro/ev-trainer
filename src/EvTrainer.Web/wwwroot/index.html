<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EVs Trainer</title>
    <base href="/" />
    <script>
        (function () {
            try {
                var prefs = JSON.parse(localStorage.getItem('evtrainer:v1:prefs') || '{}');
                if (prefs.theme === 'light' || prefs.theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', prefs.theme);
                }
                // Language (spec 011): the choice saved from the menu, otherwise the first supported browser
                // language (pt-* → pt-BR, en-* → en), otherwise English — same rule as LanguageMatcher.
                var lang = prefs.language === 'pt-BR' || prefs.language === 'en' ? prefs.language : null;
                if (!lang) {
                    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
                    for (var i = 0; i < list.length && !lang; i++) {
                        var primary = String(list[i]).trim().split('-')[0].toLowerCase();
                        lang = primary === 'pt' ? 'pt-BR' : primary === 'en' ? 'en' : null;
                    }
                }
                document.documentElement.setAttribute('lang', lang || 'en');
            } catch (e) { }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#c8202f" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot" role="status">EVs Trainer</div>
    </div>

    <div id="blazor-error-ui">
        <span class="error-text">An unexpected error has occurred.</span>
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/interop.js"></script>
    <script>evt.setLanguage(document.documentElement.lang);</script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Offline cache + updates: check for a new version on start and whenever the app comes back to the
        // foreground; when the new service worker takes control, reload once to run the new version.
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) return;
                reloading = true;
                location.reload();
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(registration => {
                const check = () => registration.update().catch(() => { });
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') check();
                });
                setInterval(check, 60 * 60 * 1000);
            });
        }
    </script>
</body>

</html>
